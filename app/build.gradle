plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.henrylumis.mediaprayer'
    compileSdk 34

    defaultConfig {
        applicationId "com.henrylumis.mediaprayer"
        minSdk 24
        targetSdk 34
        versionCode 57
        versionName "3.54"
    }

    signingConfigs {
        release {
            // GitHub Actions writes the decoded keystore to this temporary CI path.
            // Passwords and alias are read from Actions Secrets via environment variables.
            storeFile file("${rootDir}/app/rvh-music-release.jks")
            storePassword System.getenv("RVH_STORE_PASSWORD") ?: ""
            keyAlias System.getenv("RVH_KEY_ALIAS") ?: "rvh-music-release"
            keyPassword System.getenv("RVH_KEY_PASSWORD") ?: ""
        }
    }

    buildTypes {
        release {
            // Release signing material is supplied only by the build environment.
            // The private keystore and passwords must never be committed to source control.
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.fragment:fragment-ktx:1.8.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.activity:activity-ktx:1.9.1'
    implementation 'androidx.palette:palette-ktx:1.0.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    // Media3 - handles playback, MediaSession, and the system notification together
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-session:1.4.1'
    implementation 'androidx.media3:media3-common:1.4.1'
    implementation 'androidx.media3:media3-extractor:1.4.1'
    implementation 'androidx.media3:media3-transformer:1.4.1'

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    // Embedded audio metadata editing (MP3, FLAC, OGG/Vorbis, MP4/M4A and more)
    implementation 'net.jthink:jaudiotagger:3.0.1'
}
